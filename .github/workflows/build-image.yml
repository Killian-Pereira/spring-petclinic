name: Build Docker Image
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish Docker image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          PUBLISH_IMAGE: ${{ github.event_name != 'pull_request' }}
        run: |
          IMAGE_NAME="${IMAGE_NAME,,}"
          ./mvnw spring-boot:build-image -DskipTests \
            -Dspring-boot.build-image.imageName="$IMAGE_NAME:latest" \
            -Dspring-boot.build-image.publish="$PUBLISH_IMAGE"