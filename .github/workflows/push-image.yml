name: Push Docker Image
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Extract Maven version
        id: get_version
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          project = ET.parse("pom.xml").getroot()
          version = project.findtext("m:version", namespaces=namespace).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Normalize image owner
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        env:
          IMAGE_NAME: ghcr.io/${{ steps.image.outputs.owner }}/spring-petclinic
          VERSION: ${{ steps.get_version.outputs.version }}
        run: ./mvnw spring-boot:build-image -DskipTests -Dspring-boot.build-image.imageName="$IMAGE_NAME:$VERSION"
      - name: Tag and push Docker image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ghcr.io/${{ steps.image.outputs.owner }}/spring-petclinic
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          docker tag "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"
  update-gitops:
    needs: push # Mettre ici le nom de votre job précédent (celui qui push sur GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt d'infrastructure
        uses: actions/checkout@v4
        with:
          repository: 'killian-pereira/kustomize' # A REMPLACER (ex: <VOTRE_USER_GITHUB>/gitops-infra)
          token: ${{ secrets.GITOPS_PAT }}
          path: 'infra-repo' # On clone dans un sous-dossier pour ne pas écraser l'espace de travail

      - name: Mettre à jour la version de l'image
        working-directory: ./infra-repo/dev
        run: |
          kustomize edit set image spring-petclinic=ghcr.io/killian-pereira/spring-petclinic:${{ github.sha }}

      - name: Commit et Push vers le dépôt d'infrastructure
        working-directory: ./infra-repo
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Auto-update image to tag ${{ github.sha }}"
          git push



