name: Push Docker Image
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Extract Maven version
        id: get_version
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          project = ET.parse("pom.xml").getroot()
          version = project.findtext("m:version", namespaces=namespace).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Normalize image owner
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        env:
          IMAGE_NAME: ghcr.io/${{ steps.image.outputs.owner }}/spring-petclinic
          VERSION: ${{ steps.get_version.outputs.version }}
        run: ./mvnw spring-boot:build-image -DskipTests -Dspring-boot.build-image.imageName="$IMAGE_NAME:$VERSION"
      - name: Tag and push Docker image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_NAME: ghcr.io/${{ steps.image.outputs.owner }}/spring-petclinic
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          docker tag "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:$GITHUB_SHA"
          docker tag "$IMAGE_NAME:$VERSION" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"